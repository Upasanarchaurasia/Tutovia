server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _ tutovia.com www.tutovia.com;

    ssl_certificate /etc/ssl/certs/tutovia-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/tutovia-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    root /var/www/tutovia/dist;
    index index.html v2.html v3.html;

    # ── V2 Immutable Assets Caching (1 year) ──
    location ^~ /v2/assets/ {
        alias /var/www/v2/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── V2 Website Subpath (/v2 and /V2) ──
    location ^~ /v2/ {
        alias /var/www/v2/dist/;
        index index.html v2.html;
        try_files $uri $uri/ /v2/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /v2 {
        return 301 /v2/;
    }

    location ^~ /V2/ {
        return 301 /v2/;
    }

    location = /V2 {
        return 301 /v2/;
    }

    # ── V3 Immutable Assets Caching (1 year) ──
    location ^~ /v3/assets/ {
        alias /var/www/v3/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── V3 Website Subpath (/v3 and /V3) ──
    location ^~ /v3/ {
        alias /var/www/v3/dist/;
        index index.html v3.html;
        try_files $uri $uri/ /v3/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /v3 {
        return 301 /v3/;
    }

    location ^~ /V3/ {
        return 301 /v3/;
    }

    location = /V3 {
        return 301 /v3/;
    }

    # ── Main Tutovia Website ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
